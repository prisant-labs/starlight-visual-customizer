    <path id="folded-corner" d="M 823,411 C 836,411 843,416 853,427 L 964,538 C 973,547 978,558 978,568 C 972,557 963,551 950,551 H 864 C 840,551 823,533 823,510 Z" fill="url(#fold-gradient)"/>
  </g>
</svg>

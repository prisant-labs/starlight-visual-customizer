<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="246 228 800 800" role="img" aria-labelledby="title description">
  <title id="title">Starlight Visual Customizer logo</title>
  <desc id="description">Two overlapping document pages with a folded corner, and a four-point spark cut out of both.</desc>
  <defs>
    <linearGradient id="back-gradient" gradientUnits="userSpaceOnUse" x1="330" y1="290" x2="730" y2="849"><stop offset="0" stop-color="#171779"/><stop offset="1" stop-color="#191B80"/></linearGradient>
    <linearGradient id="front-gradient" gradientUnits="userSpaceOnUse" x1="600" y1="411" x2="980" y2="967"><stop offset="0" stop-color="#7E39FC"/><stop offset="1" stop-color="#7734F8"/></linearGradient>
    <linearGradient id="fold-gradient" gradientUnits="userSpaceOnUse" x1="824" y1="415" x2="970" y2="550"><stop offset="0" stop-color="#27DDFC"/><stop offset="1" stop-color="#21CFF6"/></linearGradient>
    <mask id="spark-cutout" maskUnits="userSpaceOnUse" x="246" y="228" width="800" height="800" style="mask-type:luminance">
      <rect x="246" y="228" width="800" height="800" fill="white"/>
